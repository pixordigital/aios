<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f172a;padding:40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#1e293b;border-radius:16px;overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:32px;text-align:center;">
                            <div style="width:48px;height:48px;background:#fff;border-radius:12px;margin:0 auto 16px;display:inline-block;line-height:48px;font-size:24px;font-weight:bold;color:#1e3a8a;">A</div>
                            <h1 style="color:#fff;margin:0;font-size:24px;">Reset your password</h1>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding:32px;">
                            <p style="color:#94a3b8;font-size:16px;line-height:1.6;margin:0 0 16px;">Hi {{name}},</p>
                            <p style="color:#94a3b8;font-size:16px;line-height:1.6;margin:0 0 24px;">We received a request to reset your password. Click the button below to set a new one.</p>
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="padding:0 0 24px;">
                                        <a href="{{reset_url}}" style="background:#3b82f6;color:#fff;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;display:inline-block;">Reset password →</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="color:#64748b;font-size:14px;line-height:1.6;margin:0;">This link expires in 1 hour. If you didn't request this, ignore this email — your password won't change.</p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding:16px 32px;border-top:1px solid #334155;">
                            <p style="color:#475569;font-size:12px;margin:0;text-align:center;">© 2026 AIOS • <a href="{{app_url}}" style="color:#64748b;">aios.dev</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
