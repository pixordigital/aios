{% extends "base.html" %}
{% block content %}
<h1>Novo agente — assistente</h1>
<div style="display:flex;gap:0.5rem;margin:1rem 0">
  <span class="badge" id="s1">1 Intenção</span><span class="badge" id="s2">2 Tipo</span><span class="badge" id="s3">3 Ajustes</span><span class="badge" id="s4">4 Testar</span>
</div>
<form method="POST" action="/dashboard/agents/save" id="wiz-form">
  <input type="hidden" name="agent_id" value="">
  <div class="card" data-step="1">
    <h2>O que o agente deve fazer?</h2>
    <textarea name="intent" id="wiz-intent" class="input" rows="3" placeholder="Ex.: qualificar leads BANT e agendar reunião"></textarea>
    <button type="button" class="btn btn-primary mt-2" onclick="nextStep(2)">Próximo</button>
  </div>
  <div class="card" data-step="2" style="display:none">
    <h2>Tipo</h2>
    <select name="agent_type" id="wiz-type" class="input" onchange="applyTpl(this.value)">
      {% for t in agent_types %}<option value="{{ t }}">{{ agent_type_label(t) }}</option>{% endfor %}
    </select>
    <div class="flex-between mt-2"><button type="button" class="btn btn-ghost" onclick="nextStep(1)">Voltar</button><button type="button" class="btn btn-primary" onclick="nextStep(3)">Próximo</button></div>
  </div>
  <div class="card" data-step="3" style="display:none">
    <h2>Ajustes</h2>
    <label>Nome</label><input name="name" class="input" required placeholder="Meu Agente">
    <label class="mt-2">Prompt (editável)</label><textarea name="system_prompt" id="wiz-prompt" class="input" rows="8"></textarea>
    <label class="mt-2">Ferramentas (espaço/comma)</label><input name="tools" id="wiz-tools" class="input">
    <input type="hidden" name="model" id="wiz-model" value="openai/gpt-4o"><input type="hidden" name="temperature" value="0.7"><input type="hidden" name="max_tokens" value="4096"><input type="hidden" name="short_term_buffer" value="50">
    <div class="flex-between mt-2"><button type="button" class="btn btn-ghost" onclick="nextStep(2)">Voltar</button><button type="button" class="btn btn-primary" onclick="nextStep(4)">Próximo</button></div>
  </div>
  <div class="card" data-step="4" style="display:none">
    <h2>Revisar e criar</h2>
    <p class="text-sm text-secondary">Revise prompt e clique Criar. Teste opcional após criar em /dashboard/agents.</p>
    <div class="flex-between mt-2"><button type="button" class="btn btn-ghost" onclick="nextStep(3)">Voltar</button><button type="submit" class="btn btn-primary">Criar agente</button></div>
  </div>
</form>
<script>
var TPL={{ agent_templates | tojson }};
function nextStep(n){ document.querySelectorAll('[data-step]').forEach(function(el){ el.style.display = parseInt(el.dataset.step)===n ? 'block':'none'; }); document.querySelectorAll('[id^=s]').forEach(function(b,i){ b.style.borderColor = (i+1)<=n ? 'var(--accent)' : 'var(--border)'; }); }
function applyTpl(t){ var c=TPL[t]||{}; document.getElementById('wiz-prompt').value=c.system_prompt||''; document.getElementById('wiz-tools').value=(c.tools||[]).join(', '); document.getElementById('wiz-model').value=(c.llm_config||{}).model||'openai/gpt-4o'; var intent=document.getElementById('wiz-intent').value.trim(); if(intent) document.getElementById('wiz-prompt').value = intent + "\n\n" + document.getElementById('wiz-prompt').value; }
nextStep(1);
document.getElementById('wiz-form').addEventListener('submit', function(e){ var v=document.getElementById('wiz-prompt').value||''; if(!v.trim()||v.trim().length<20){ e.preventDefault(); alert('Prompt muito curto (min 20)');} });
</script>
{% endblock %}
