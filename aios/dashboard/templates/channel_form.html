{% extends "base.html" %}
{% block content %}
<div class="flex-between mb-4">
    <div><h1>{% if channel %}Editar{% else %}Novo{% endif %} Canal</h1></div>
</div>

<form method="POST" action="/dashboard/channels/save">
    <input type="hidden" name="channel_id" value="{{ channel.id if channel else '' }}">
    <div class="flex-col gap-4">

        <div class="card">
            <h2 class="mb-3">Canal</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div>
                    <label>Rótulo</label>
                    <input type="text" name="label" value="{{ channel.label if channel else '' }}" required class="input" placeholder="WhatsApp de Produção">
                </div>
                <div>
                    <label>Tipo</label>
                    <select name="channel_type" class="input" onchange="showChannelCreds(this.value)">
                        {% set types = ['web', 'whatsapp', 'evolution', 'slack', 'telegram', 'discord', 'email'] %}
                        {% for t in types %}
                        <option value="{{ t }}" {% if channel and channel.channel_type == t %}selected{% endif %}>{{ channel_type_label(t) }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="mb-3">Credenciais</h2>
            <div id="creds-web" class="channel-creds" style="display:none"><p class="text-sm text-secondary">Os canais web não precisam de configuração.</p></div>
            <div id="creds-whatsapp" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div><label>Provedor</label>
                    <select name="config_whatsapp_provider" class="input" onchange="showWaProvider(this.value)">
                        <option value="meta" {% if channel and channel.config and channel.config.get('provider') != 'zernio' %}selected{% endif %}>Meta (WhatsApp Cloud API)</option>
                        <option value="zernio" {% if channel and channel.config and channel.config.get('provider') == 'zernio' %}selected{% endif %}>Zernio</option>
                    </select>
                </div>
                <div id="wa-meta">
                    <div><label>Token de acesso</label><input type="text" name="config_whatsapp_token" value="{{ channel.config.get('access_token', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="EAA..."></div>
                    <div><label>ID do número de telefone</label><input type="text" name="config_whatsapp_phone" value="{{ channel.config.get('phone_id', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="123456789"></div>
                </div>
                <div id="wa-zernio" style="display:none;flex-direction:column;gap:0.75rem">
                    <div><label>Chave da API</label><input type="text" name="config_zernio_key" value="{{ channel.config.get('api_key', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="zrk_..."></div>
                    <div><label>ID da conta</label><input type="text" name="config_zernio_account" value="{{ channel.config.get('account_id', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="66b2e19d..."></div>
                    <div><label>Nome do template (cold outreach)</label><input type="text" name="config_zernio_template" value="{{ channel.config.get('template_name', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="sdr_hello"></div>
                    <div><label>Idioma do template</label><input type="text" name="config_zernio_lang" value="{{ channel.config.get('template_language', 'en_US') if channel and channel.config else 'en_US' }}" class="input input-mono" placeholder="en_US"></div>
                </div>
            </div>
            <div id="creds-slack" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div><label>Token do bot</label><input type="text" name="config_slack_token" value="{{ channel.config.get('bot_token', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="xoxb-..."></div>
                <div><label>Segredo de assinatura</label><input type="text" name="config_slack_secret" value="{{ channel.config.get('signing_secret', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="abc..."></div>
            </div>
            <div id="creds-telegram" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div><label>Token do bot</label><input type="text" name="config_telegram_token" value="{{ channel.config.get('bot_token', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="123:ABC..."></div>
            </div>
            <div id="creds-discord" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div><label>Token do bot</label><input type="text" name="config_discord_token" value="{{ channel.config.get('bot_token', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="MTIz..."></div>
            </div>
            <div id="creds-email" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
                    <div><label>Servidor IMAP</label><input type="text" name="config_email_imap" value="{{ channel.config.get('imap_server', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="imap.gmail.com"></div>
                    <div><label>Servidor SMTP</label><input type="text" name="config_email_smtp" value="{{ channel.config.get('smtp_server', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="smtp.gmail.com"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
                    <div><label>E-mail</label><input type="email" name="config_email_addr" value="{{ channel.config.get('email', '') if channel and channel.config else '' }}" class="input" placeholder="bot@example.com"></div>
                    <div><label>Senha</label><input type="password" name="config_email_pass" class="input" placeholder="Senha de aplicativo"></div>
                </div>
            </div>
            <div id="creds-evolution" class="channel-creds" style="display:none;flex-direction:column;gap:0.75rem">
                <div><label>URL do servidor</label><input type="text" name="config_evo_server" value="{{ channel.config.get('server_url', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="http://localhost:8080"></div>
                <div><label>Chave da API</label><input type="text" name="config_evo_key" value="{{ channel.config.get('api_key', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="evointegration..."></div>
                <div><label>Nome da instância</label><input type="text" name="config_evo_instance" value="{{ channel.config.get('instance', '') if channel and channel.config else '' }}" class="input input-mono" placeholder="my-whatsapp-instance"></div>
            </div>
        </div>

        <div class="card">
            <h2 class="mb-3">Atribuição</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div><label>Agente (opcional)</label>
                    <select name="agent_id" class="input">
                        <option value="">— Nenhum —</option>
                        {% for a in agents %}
                        <option value="{{ a.id }}" {% if channel and channel.agent_id == a.id %}selected{% endif %}>{{ a.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div><label>Equipe (opcional)</label>
                    <select name="team_id" class="input">
                        <option value="">— Nenhum —</option>
                        {% for t in teams %}
                        <option value="{{ t.id }}" {% if channel and channel.team_id == t.id %}selected{% endif %}>{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="flex-between">
            <div class="flex-center gap-2">
                <a href="/dashboard/channels" class="btn btn-ghost">Cancelar</a>
                <button type="button" class="btn btn-ghost" id="test-btn" onclick="testConnection()" style="color:var(--accent);border-color:var(--accent-border)">🔄 Testar conexão</button>
            </div>
            <button type="submit" class="btn btn-primary" style="padding:0.5rem 1.5rem">{% if channel %}Salvar{% else %}Criar canal{% endif %}</button>
        </div>
        <div id="test-result" style="display:none;margin-top:0.5rem;padding:0.5rem 0.75rem;border-radius:var(--radius-sm);font-size:0.8125rem"></div>

<script>
async function testConnection() {
    var btn = document.getElementById('test-btn');
    var result = document.getElementById('test-result');
    btn.disabled = true; btn.textContent = '⏳ Testando...'; result.style.display = 'none';

    var channelType = document.querySelector('select[name="channel_type"]')?.value || 'web';
    var config = {};
    document.querySelectorAll('[name^="config_"]').forEach(function(el) {
        var key = el.name.replace('config_', '');
        if (el.value) config[key] = el.value;
    });

    try {
        var resp = await fetch('/api/channels/test', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel_type: channelType, config: config})
        });
        var data = await resp.json();
        result.style.display = 'block';
        result.style.background = data.ok ? 'var(--green-subtle)' : 'var(--red-subtle)';
        result.style.color = data.ok ? 'var(--green)' : 'var(--red)';
        result.style.border = '1px solid ' + (data.ok ? 'var(--green)' : 'var(--red)');
        result.textContent = (data.ok ? '✅ ' : '❌ ') + (data.message || (data.ok ? 'Conectado' : 'Falhou'));
    } catch(e) {
        result.style.display = 'block';
        result.style.background = 'var(--red-subtle)';
        result.style.color = 'var(--red)';
        result.textContent = '❌ Erro: ' + e.message;
    }
    btn.disabled = false; btn.textContent = '🔄 Testar conexão';
}
</script>

    </div>
</form>

<script>
    function showWaProvider(v){
        var meta=document.getElementById('wa-meta'), zn=document.getElementById('wa-zernio');
        if(!meta||!zn)return;
        if(v==='zernio'){meta.style.display='none';zn.style.display='flex';}
        else{meta.style.display='block';zn.style.display='none';}
    }
    function showChannelCreds(t){document.querySelectorAll('.channel-creds').forEach(function(e){e.style.display='none'});var el=document.getElementById('creds-'+t);if(el)el.style.display='flex';if(t==='whatsapp')showWaProvider(document.querySelector('select[name="config_whatsapp_provider"]')?.value||'meta');}
    document.addEventListener('DOMContentLoaded',function(){showChannelCreds(document.querySelector('select[name="channel_type"]').value);});
</script>
{% endblock %}
