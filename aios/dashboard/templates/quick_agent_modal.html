<!-- Quick Agent Wizard — available globally -->
<dialog id="quick-agent" style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:0;width:min(480px,94vw);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,0.5)">
    <form method="POST" action="/dashboard/agents/save" style="padding:1.25rem">
        <div class="flex-between mb-3">
            <h2>Criar agente</h2>
            <div class="flex-center gap-2">
                <a href="/dashboard/agents/new" class="btn btn-ghost btn-sm" style="font-size:0.7rem">Editor completo →</a>
                <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('quick-agent').close()" style="border:none">✕</button>
            </div>
        </div>
        <div class="flex-col gap-3">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
                <div>
                    <label>Nome</label>
                    <input type="text" name="name" required class="input" placeholder="ex.: SDR de Vendas" autofocus>
                </div>
                <div>
                    <label>Tipo</label>
                    <select name="agent_type" class="input" onchange="fillAgentPrompt(this)">
                        <option value="sdr">SDR — Desenvolvimento de Vendas</option>
                        <option value="closer">Closer — Fechamento de Negócios</option>
                        <option value="support">Suporte — Atendimento ao Cliente</option>
                        <option value="data_analyst">Analista de Dados</option>
                        <option value="data_scientist">Cientista de Dados</option>
                        <option value="orchestrator">Orquestrador — Coordenador de Equipe</option>
                        <option value="manager">Gerente — Qualidade e Escalonamentos</option>
                        <option value="custom">Personalizado</option>
                    </select>
                </div>
            </div>
            <div>
                <label>Modelo</label>
                <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.5rem">
                    <select name="model" id="qa-model" class="input model-select">
                        <optgroup label="OpenAI">
                            <option value="openai/gpt-4o" selected>GPT-4o</option>
                            <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                            <option value="openai/gpt-4.1-mini">GPT-4.1 Mini</option>
                            <option value="openai/o3-mini">o3 Mini</option>
                        </optgroup>
                        <optgroup label="Anthropic">
                            <option value="anthropic/claude-sonnet-4-20250514">Claude Sonnet 4</option>
                            <option value="anthropic/claude-5-opus-20250714">Claude Opus 5</option>
                        </optgroup>
                        <optgroup label="Google">
                            <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
                        </optgroup>
                        <optgroup label="DeepSeek">
                            <option value="deepseek/deepseek-v4-flash">DeepSeek V4 Flash</option>
                            <option value="deepseek/deepseek-v4">DeepSeek V4</option>
                        </optgroup>
                    </select>
                    <input type="number" name="temperature" step="0.1" min="0" max="2" value="0.7" class="input" placeholder="Temp">
                    <input type="number" name="max_tokens" step="1" min="256" max="16384" value="4096" class="input" placeholder="Tokens">
                </div>
            </div>
            <div>
                <label>Ferramentas</label>
                <div class="flex-center gap-1" style="flex-wrap:wrap">
                    <label class="flex-center gap-1" style="font-size:0.75rem;padding:0.25rem 0.5rem;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;background:var(--bg)">
                        <input type="checkbox" class="qa-tool-cb" value="calculator" style="accent-color:var(--accent)"> Calculadora
                    </label>
                    <label class="flex-center gap-1" style="font-size:0.75rem;padding:0.25rem 0.5rem;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;background:var(--bg)">
                        <input type="checkbox" class="qa-tool-cb" value="web_search" style="accent-color:var(--accent)"> Busca na Web
                    </label>
                    <label class="flex-center gap-1" style="font-size:0.75rem;padding:0.25rem 0.5rem;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;background:var(--bg)">
                        <input type="checkbox" class="qa-tool-cb" value="send_email" style="accent-color:var(--accent)"> E-mail
                    </label>
                </div>
                <input type="hidden" name="tools" id="qa-tools-hidden" value="">
                <input type="hidden" name="short_term_buffer" value="50">
                <input type="hidden" name="long_term_enabled" value="false">
                <input type="hidden" name="episodic_enabled" value="false">
                <input type="hidden" name="system_prompt" id="qa-system-prompt" value="">
            </div>
            <div class="flex-between" style="padding-top:0.5rem;border-top:1px solid var(--border)">
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('quick-agent').close()">Cancelar</button>
                <button type="submit" class="btn btn-primary" onclick="collectAgentTools()">Criar agente</button>
            </div>
        </div>
    </form>
</dialog>

<script>
    var PROMPTS = {
        'sdr': 'Você é um agente de IA SDR (Representante de Desenvolvimento de Vendas). Prospecte, qualifique leads usando BANT e agende reuniões. Seja persistente, mas respeitoso.',
        'closer': 'Você é um agente de IA Closer. Feche negócios revisando o contexto do lead, apresentando soluções personalizadas, lidando com objeções e enviando propostas.',
        'support': 'Você é um agente de IA de Suporte ao Cliente. Resolva problemas rapidamente e com empatia. Reconheça, esclareça, resolva ou escalone. Nunca culpe o cliente.',
        'data_analyst': 'Você é um agente de IA Analista de Dados. Consulte bancos de dados, gere relatórios e crie visualizações. Explique o que os dados significam, não apenas o que mostram.',
        'data_scientist': 'Você é um agente de IA Cientista de Dados. Construa modelos, execute análises e forneça recomendações baseadas em dados. Explique a metodologia.',
        'orchestrator': 'Você é um agente de IA Orquestrador. Encaminhe solicitações ao membro certo da equipe, coordene fluxos de trabalho multiagente e sintetize respostas.',
        'manager': 'Você é um agente de IA Gerente. Supervisione o desempenho da equipe, lide com escalonamentos e garanta a qualidade. Revise respostas e oriente agentes.',
        'custom': 'Você é um agente de IA. Ajude os usuários com seus pedidos usando as ferramentas disponíveis.',
    };
    function fillAgentPrompt(sel) {
        var models = {'orchestrator':'openai/gpt-4o','manager':'openai/gpt-4o','sdr':'openai/gpt-4o','closer':'openai/gpt-4o','support':'openai/gpt-4o-mini','data_analyst':'openai/gpt-4o','data_scientist':'openai/gpt-4o','custom':'openai/gpt-4o-mini'};
        document.getElementById('qa-model').value = models[sel.value] || 'openai/gpt-4o';
        document.getElementById('qa-system-prompt').value = PROMPTS[sel.value] || PROMPTS['custom'];
        var toolMap = {'sdr':['web_search','send_email'],'closer':['send_email'],'data_analyst':['calculator'],'data_scientist':['calculator']};
        var tools = toolMap[sel.value] || [];
        document.querySelectorAll('.qa-tool-cb').forEach(function(cb){ cb.checked = tools.indexOf(cb.value) >= 0; });
    }
    function collectAgentTools() {
        var tools = [];
        document.querySelectorAll('.qa-tool-cb:checked').forEach(function(cb){ tools.push(cb.value); });
        document.getElementById('qa-tools-hidden').value = tools.join(' ');
        if(!document.getElementById('qa-system-prompt').value) {
            document.getElementById('qa-system-prompt').value = 'Você é um agente de IA. Ajude os usuários com seus pedidos.';
        }
    }
    document.addEventListener('DOMContentLoaded', function(){
        var sel = document.querySelector('#quick-agent select[name="agent_type"]');
        if(sel) fillAgentPrompt(sel);
    });
</script>
