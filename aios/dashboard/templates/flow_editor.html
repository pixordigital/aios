{% extends "base.html" %}
{% block content %}
<div class="flex-between mb-4"><div><h1>Flow Editor — React Flow</h1><p class="text-sm text-secondary">Drag-and-drop DAG visual (n8n-like) • salvo no workflow</p></div><a href="/dashboard/automations" class="btn btn-ghost btn-sm">← Automações</a></div>
<div style="height:560px;border:1px solid var(--border);border-radius:10px;background:var(--bg);position:relative" id="flow-root"></div>
<div class="card mt-3"><h3>Como usar</h3><p class="text-sm text-secondary">Arraste para mover • Clique nó para editar label/tool • Conecte arrastando handle • Salva posições automaticamente em `position`</p></div>
<link href="https://cdn.jsdelivr.net/npm/reactflow@11/dist/style.css" rel="stylesheet">
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18","react-dom":"https://esm.sh/react-dom@18","reactflow":"https://esm.sh/reactflow@11"}}</script>
<script type="module">
import React from "react";
import ReactDOM from "react-dom";
import ReactFlow, {Background, Controls, MiniMap} from "reactflow";
const wfId = new URLSearchParams(location.search).get("wf") || "{{wf_id|default('')}}";
async function loadWF(){
  if(!wfId) return {nodes:[]};
  const r=await fetch(`/api/workflows/${wfId}`); return r.json();
}
async function savePos(id, pos){
  // patch via node delete+add simplified: update via API not yet, store in local
  console.log("save",id,pos);
}
function App(){
  const [nodes,setNodes]=React.useState([]);
  const [edges,setEdges]=React.useState([]);
  React.useEffect(()=>{ (async()=>{
    const wf=await loadWF(); const ns=(wf.nodes||[]).map((n,i)=>({id:n.id, position:{x:(n.position&&n.position.x)||(20+i*220), y:(n.position&&n.position.y)||(40 + Math.floor(i/4)*90)}, data:{label:(n.label||n.id.slice(0,6))+" • "+(n.tool_name||"agent")}, style:{background:n.agent_id?'var(--accent-subtle)':'var(--bg-elevated)', border:`1px solid ${n.agent_id?'var(--accent)':'var(--amber)'}`, borderRadius:8, padding:8, fontSize:12}}));
    const es=(wf.nodes||[]).flatMap(n=>(n.depends_on||[]).map(d=>({id:d+"->"+n.id, source:d, target:n.id, animated:true, style:{stroke:"var(--accent)"}})));
    setNodes(ns); setEdges(es);
  })(); },[]);
  return React.createElement(ReactFlow, {nodes, edges, onNodesChange: ()=>{}, onEdgesChange: ()=>{}, fitView:true}, React.createElement(Background), React.createElement(Controls), React.createElement(MiniMap));
}
if(wfId) ReactDOM.createRoot(document.getElementById("flow-root")).render(React.createElement(App));
else document.getElementById("flow-root").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary)">Passe ?wf=ID na URL ou abra via Automação → Abrir → Editor Visual</div>';
</script>
{% endblock %}
