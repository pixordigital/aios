<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS — Entrar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --bg-raised: #111111; --bg-elevated: #161616;
            --border: #1f1f1f; --text: #e5e5e5; --text-secondary: #737373;
            --accent: #00e5a0; --accent-subtle: rgba(0,229,160,0.08);
            --red: #ef4444;
            --radius: 10px; --radius-sm: 6px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        .card {
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2rem;
            width: 100%; max-width: 380px;
        }
        .logo { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; letter-spacing: -0.02em; font-family: 'JetBrains Mono', monospace; }
        .logo span { color: var(--accent); }
        .subtitle { text-align: center; color: var(--text-secondary); font-size: 0.8125rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.375rem; }
        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.5rem 0.625rem;
            color: var(--text); font-size: 0.875rem; font-family: inherit;
            outline: none; transition: border-color 0.1s; margin-bottom: 1rem;
        }
        input:focus { border-color: var(--accent); }
        .btn {
            width: 100%; padding: 0.625rem; border-radius: var(--radius-sm);
            font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer;
            background: var(--accent); color: #0a0a0a; transition: all 0.15s;
        }
        .btn:hover { box-shadow: 0 0 20px rgba(0,229,160,0.3); }
        .error { color: var(--red); font-size: 0.8125rem; margin-bottom: 0.75rem; text-align: center; }
        .footer { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 1rem; }
        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">ai<span>os</span></div>
        <div class="subtitle">Acesse sua conta</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/dashboard/login">
            <label>E-mail</label>
            <input type="email" name="email" required autocomplete="email" placeholder="voce@empresa.com">

            <label>Senha</label>
            <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">

            <button type="submit" class="btn">Entrar</button>
        </form>

        <div class="footer">
            Não tem uma conta? <a href="/dashboard/register">Registrar</a>
        </div>
    </div>
</body>
</html>
