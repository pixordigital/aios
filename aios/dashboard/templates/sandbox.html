{% extends "base.html" %}
{% block title %}Agent Sandbox{% endblock %}

{% block head %}
<style>
  #sandbox-chat { display:flex;flex-direction:column;height:calc(100vh-180px);min-height:400px; }
  #sandbox-messages { flex:1;overflow-y:auto;padding:1rem;background:var(--bg-secondary);border-radius:8px;margin-bottom:0.75rem; }
  #sandbox-messages .msg { margin-bottom:0.75rem;padding:0.5rem 0.75rem;border-radius:8px;max-width:85%; }
  #sandbox-messages .msg.user { background:var(--accent);color:#fff;margin-left:auto; }
  #sandbox-messages .msg.assistant { background:var(--bg-primary);border:1px solid var(--border); }
  #sandbox-messages .msg.tool { background:var(--bg-tertiary);font-size:0.8125rem;color:var(--text-tertiary); }
  #sandbox-messages .msg .cursor { display:inline-block;width:2px;height:1em;background:var(--accent);animation:blink 0.8s infinite;vertical-align:middle;margin-left:2px; }
  @keyframes blink { 50% { opacity:0 } }
  #sandbox-input { display:flex;gap:0.5rem; }
  #sandbox-input textarea { flex:1;padding:0.5rem;border:1px solid var(--border);border-radius:6px;resize:none;font:inherit;font-size:0.875rem;background:var(--bg-primary);color:var(--text); }
  #sandbox-input button { padding:0.5rem 1.25rem;border-radius:6px; }
  #sandbox-status { font-size:0.8125rem;color:var(--text-tertiary);text-align:center; }
  .tool-badge { display:inline-block;font-size:0.75rem;padding:0.125rem 0.5rem;border-radius:4px;background:var(--bg-tertiary);color:var(--text-secondary);margin-right:0.25rem; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Agent Sandbox</h1>
  <p class="subtitle">Test agents interactively — real LLM calls, streaming output</p>
</div>

<div class="card">
  <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
    <select id="sandbox-agent" style="flex:1;min-width:200px" onchange="clearChat()">
      <option value="">— Select an active agent —</option>
      {% for a in agents %}
      <option value="{{a.id}}">{{a.name}} ({{a.agent_type}})</option>
      {% endfor %}
    </select>
    <button class="btn btn-secondary" onclick="clearChat()">Clear</button>
  </div>

  <div id="sandbox-chat">
    <div id="sandbox-messages">
      <div style="text-align:center;color:var(--text-tertiary);padding:2rem;font-size:0.875rem">
        Select an agent and send a message to start testing.
      </div>
    </div>
    <form id="sandbox-form" onsubmit="sendMessage(event)">
      <div id="sandbox-input">
        <textarea id="sandbox-msg" rows="2" placeholder="Type your test message..." disabled></textarea>
        <button type="submit" class="btn btn-primary" disabled>Send</button>
      </div>
    </form>
    <div id="sandbox-status"></div>
  </div>
</div>

<script>
  let currentConvId = '';
  let currentAbort = null;

  document.getElementById('sandbox-agent').onchange = function() {
    const disabled = !this.value;
    document.getElementById('sandbox-msg').disabled = disabled;
    document.querySelector('#sandbox-form button').disabled = disabled;
    if (!disabled) document.getElementById('sandbox-msg').focus();
  };

  function clearChat() {
    if (currentAbort) { currentAbort.abort(); currentAbort = null; }
    document.getElementById('sandbox-messages').innerHTML = '';
    currentConvId = '';
    document.getElementById('sandbox-status').textContent = '';
  }

  function appendMessage(role, content, extra) {
    const div = document.getElementById('sandbox-messages');
    const empty = div.querySelector('div[style*="text-align:center"]');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    if (extra) {
      el.innerHTML = '<span class="tool-badge">' + extra + '</span>' + escapeHtml(content);
    } else {
      el.textContent = content;
    }
    // cursor for streaming assistant
    if (role === 'assistant-streaming') {
      el.className = 'msg assistant';
      el.innerHTML = escapeHtml(content) + '<span class="cursor"></span>';
    }
    div.appendChild(el);
    div.scrollTop = div.scrollHeight;
    return el;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function sendMessage(e) {
    e.preventDefault();
    const agentId = document.getElementById('sandbox-agent').value;
    const msg = document.getElementById('sandbox-msg').value.trim();
    if (!agentId || !msg) return;

    if (currentAbort) currentAbort.abort();
    currentAbort = new AbortController();
    document.getElementById('sandbox-msg').value = '';
    document.getElementById('sandbox-status').textContent = 'Streaming...';

    appendMessage('user', msg);

    let assistantEl = null;
    let buffer = '';

    const formData = new URLSearchParams();
    formData.set('agent_id', agentId);
    formData.set('message', msg);
    formData.set('conversation_id', currentConvId);

    try {
      const resp = await fetch('/dashboard/sandbox/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: formData.toString(),
        signal: currentAbort.signal,
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let partial = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        partial += decoder.decode(value, {stream: true});
        const lines = partial.split('\n');
        partial = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));

          if (data.conversation_id) {
            currentConvId = data.conversation_id;
          } else if (data.type === 'token') {
            buffer += data.content;
            if (!assistantEl) {
              assistantEl = appendMessage('assistant-streaming', buffer);
            } else {
              assistantEl.innerHTML = escapeHtml(buffer) + '<span class="cursor"></span>';
            }
            const div = document.getElementById('sandbox-messages');
            div.scrollTop = div.scrollHeight;
          } else if (data.type === 'tool_call') {
            const names = (data.tool_calls || []).map(tc => tc.function?.name || '?').join(', ');
            appendMessage('tool', '🔧 Tool called: ' + names);
          } else if (data.type === 'done') {
            if (assistantEl) {
              assistantEl.innerHTML = escapeHtml(buffer);
            }
            document.getElementById('sandbox-status').textContent = '✓ Complete';
          } else if (data.type === 'error') {
            appendMessage('tool', '❌ Error: ' + (data.error || 'unknown'));
            document.getElementById('sandbox-status').textContent = '✗ Error';
          }
        }
      }
      if (assistantEl) assistantEl.innerHTML = escapeHtml(buffer);
      document.getElementById('sandbox-status').textContent = '✓ Complete';
    } catch (err) {
      if (err.name !== 'AbortError') {
        document.getElementById('sandbox-status').textContent = '✗ ' + err.message;
      }
    }
    currentAbort = null;
  }
</script>
{% endblock %}
