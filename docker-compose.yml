# AIOS — production with Redis task queue + background worker
# Usage: docker compose up -d
# Requires .env file with AIOS_DATABASE_URL, AIOS_JWT_SECRET, etc.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8777:8777"
    env_file: .env
    environment:
      AIOS_REDIS_URL: redis://redis:6379
      AIOS_DATABASE_URL: postgresql+asyncpg://aios:aios@postgres:5432/aios
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "aios.tasks.worker"]
    env_file: .env
    environment:
      AIOS_REDIS_URL: redis://redis:6379
      AIOS_DATABASE_URL: postgresql+asyncpg://aios:aios@postgres:5432/aios
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
