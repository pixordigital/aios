# AIOS — production with Redis task queue + background worker
# Usage: docker compose up -d
# Requires .env file with AIOS_DATABASE_URL, AIOS_JWT_SECRET, etc.

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: ${AIOS_COMPOSE_PG_PASSWORD:-aios}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # security: NOT exposed to host/network — app + worker reach it via the
    # internal docker network (redis://redis:6379). Requires password via
    # AIOS_REDIS_URL=redis://:password@redis:6379 in .env.
    command: ["redis-server", "--requirepass", "${AIOS_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AIOS_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8777:8777"
    env_file: .env
    environment:
      AIOS_REDIS_URL: "redis://:${AIOS_REDIS_PASSWORD}@redis:6379/0"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default
      - supabase
      - convex
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  squid:
    image: sameersbn/squid:latest
    ports: ["3128:3128"]
    volumes: ["./deploy/squid/squid.conf:/etc/squid/squid.conf"]
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -master.port=9333 -volume.port=9334 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data"
    ports: ["8333:8333","9333:9333"]
    volumes: ["seaweedfs-data:/data","./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json"]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    cap_add: ["IPC_LOCK"]
    ports: ["8200:8200"]
    environment: {VAULT_ADDR: "http://0.0.0.0:8200"}
    volumes: ["vault-data:/vault/file","./deploy/vault/config.hcl:/vault/config/config.hcl"]
    command: "server -config=/vault/config/config.hcl"
    restart: unless-stopped

  janus:
    image: canyan/janus-gateway:latest
    ports: ["8088:8088","8188:8188","10000-10200:10000-10200/udp"]
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "aios.tasks.worker"]
    env_file: .env
    environment:
      AIOS_REDIS_URL: "redis://:${AIOS_REDIS_PASSWORD}@redis:6379/0"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default
      - supabase
      - convex
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; from urllib.parse import urlparse; u=os.environ.get('AIOS_REDIS_URL','redis://redis:6379/0'); p=urlparse(u); r=redis.Redis(host=p.hostname or 'redis',port=p.port or 6379,password=p.password or os.environ.get('AIOS_REDIS_PASSWORD')); r.ping()\""]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  seaweedfs-data:
  vault-data:

networks:
  default:
    name: pixor_aios_default
  supabase:
    external: true
    name: x7cec17of43bremk02s521wj
  convex:
    external: true
    name: dnegt58yjh5x380z724ahoba
