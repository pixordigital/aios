# AIOS CI — lint + test + build
# Triggered on push to main and pull requests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSIONS: "3.11 3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-ruff@v2
        with:
          version: "latest"
      - name: Run ruff check
        run: ruff check aios/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . mypy
      - name: Run mypy
        run: mypy aios/ --ignore-missing-imports

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest pytest-asyncio alembic
      - name: Check migrations up to date
        run: alembic check
      - name: Run tests
        run: pytest -v --tb=short --ignore=aios/templates --ignore=aios/dashboard

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aios:test .

  docker-compose:
    name: Docker Compose verify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start compose
        run: |
          docker compose up -d
      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8777/health/ready; then
              echo "Healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out"
          exit 1
      - name: Check logs
        if: failure()
        run: docker compose logs app