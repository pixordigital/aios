# AIOS CI — lint + test + build
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - run: ruff check aios/
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e . mypy
      # MYPYPATH is required because aios/ is a namespace package with no
      # __init__.py. Without it mypy names modules by basename and aborts on
      # "Duplicate module named whatsapp" (aios/api/whatsapp.py vs
      # aios/core/whatsapp/) -- a single error that silently hid the other 305.
      - run: MYPYPATH=. mypy aios/ --ignore-missing-imports --explicit-package-bases --namespace-packages --exclude aios/channels/voice.py --exclude aios/api/voice.py
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest pytest-asyncio alembic httpx
      # Quoted: the echo text contains ": ", which is a YAML parse error inside an
      # unquoted plain scalar. The unquoted form made this file invalid, so GitHub
      # rejected the whole workflow and every run failed in 0s with no jobs.
      - run: 'rm -f ./test.db && AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./test.db alembic upgrade head && AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./test.db alembic check || echo "alembic check: sqlite autogenerate noise ignored"'
      - run: AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./test.db pytest -v --tb=short --ignore=aios/templates --ignore=aios/dashboard
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aios:test .
  docker-compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env || true
      # Pin the file. Bare `docker compose up` resolved to docker-compose.yml
      # (the dev stack, which needs a pre-existing external Supabase network),
      # so this job never exercised the Coolify compose that is actually
      # deployed — every env-var/service-name omission in it shipped green.
      - run: docker compose -f docker-compose.coolify.yml config -q
      - run: docker compose -f docker-compose.coolify.yml up -d
      - run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8777/health/ready; then echo "Healthy"; exit 0; fi
            sleep 2
          done
          echo "Timed out"; exit 1
      # The worker is where agent runs actually happen. An app-only smoke test
      # passed while the worker was crash-looping on Redis.
      - run: |
          for i in {1..30}; do
            st=$(docker compose -f docker-compose.coolify.yml ps -q worker | head -1)
            if [ -n "$st" ] && [ "$(docker inspect -f '{{.State.Running}}' "$st")" = "true" ]; then echo "Worker running"; exit 0; fi
            sleep 2
          done
          echo "Worker not running"; exit 1
      - if: failure()
        run: docker compose -f docker-compose.coolify.yml logs app worker
