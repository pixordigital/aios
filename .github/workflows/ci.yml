# AIOS CI — lint + test + build
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - run: ruff check aios/
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e . mypy
      # MYPYPATH is required because aios/ is a namespace package with no
      # __init__.py. Without it mypy names modules by basename and aborts on
      # "Duplicate module named whatsapp" (aios/api/whatsapp.py vs
      # aios/core/whatsapp/) -- a single error that silently hid the other 305.
      - run: MYPYPATH=. mypy aios/ --ignore-missing-imports --explicit-package-bases --namespace-packages --exclude aios/channels/voice.py --exclude aios/api/voice.py
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest pytest-asyncio alembic httpx
      # Blocking, and deliberately so. This used to be one line ending in
      # `|| echo "...noise ignored"`, which swallowed the failure: the chain had
      # two heads, `alembic upgrade head` errored out, and the message said
      # "ignored" -- so tests ran against a schema built by
      # Base.metadata.create_all and no migration was ever exercised.
      # `alembic upgrade head` exits non-zero on multiple heads, which makes it
      # the guard on its own; a forked chain cannot pass this again.
      - name: migrations apply from empty to head
        run: |
          rm -f ./migrate_check.db
          AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./migrate_check.db alembic upgrade head
          AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./migrate_check.db alembic current
      # Advisory only, and no longer described as noise. The models and the
      # migrations genuinely disagree today -- a `blacklist` table that exists in
      # migrations but in no model, plus nullable/index/FK drift across the
      # whatsapp_* tables -- so this must not gate a commit. It is reported so
      # the drift stays visible until it is paid down.
      - name: report model/migration drift
        run: |
          AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./migrate_check.db alembic check \
            || echo "::warning::alembic check: models and migrations have drifted. Known and tracked; not gating."
      - run: AIOS_JWT_SECRET=test-secret AIOS_DATABASE_URL=sqlite+aiosqlite:///./test.db pytest -v --tb=short --ignore=aios/templates --ignore=aios/dashboard
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aios:test .
  docker-compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env || true
      # Pin the file. Bare `docker compose up` resolved to docker-compose.yml
      # (the dev stack, which needs a pre-existing external Supabase network),
      # so this job never exercised the Coolify compose that is actually
      # deployed — every env-var/service-name omission in it shipped green.
      - run: docker compose -f docker-compose.coolify.yml config -q
      - run: docker compose -f docker-compose.coolify.yml up -d
      - run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8777/health/ready; then echo "Healthy"; exit 0; fi
            sleep 2
          done
          echo "Timed out"; exit 1
      # The worker is where agent runs actually happen. An app-only smoke test
      # passed while the worker was crash-looping on Redis.
      - run: |
          for i in {1..30}; do
            st=$(docker compose -f docker-compose.coolify.yml ps -q worker | head -1)
            if [ -n "$st" ] && [ "$(docker inspect -f '{{.State.Running}}' "$st")" = "true" ]; then echo "Worker running"; exit 0; fi
            sleep 2
          done
          echo "Worker not running"; exit 1
      - if: failure()
        run: docker compose -f docker-compose.coolify.yml logs app worker
