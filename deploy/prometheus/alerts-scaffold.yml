# Prometheus config scaffold (safe, no prod wiring).
# Do not drop into production unchanged. Validate endpoints, credentials, and labels.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # TODO: set Alertmanager address in target environment.
            - alertmanager:9093

# Scrape jobs are environment-specific; keep minimal placeholders here.
scrape_configs:
  - job_name: aios
    metrics_path: /metrics
    static_configs:
      - targets:
          # TODO: set AIOS target(s). /metrics requires superadmin auth in current implementation.
          - aios:8000
