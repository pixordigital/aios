# AIOS — Coolify 1-Click (enterprise: app + worker + postgres + redis + otel)
# Deploy: Coolify → New Resource → Docker Compose (Raw) → paste this file
# Docs: COOLIFY_SETUP.md

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  otel:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol.yaml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8777:8777"
    environment:
      AIOS_DEBUG: "false"
      AIOS_APP_URL: ${AIOS_APP_URL}
      AIOS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aios}"
      AIOS_REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0"
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET}
      AIOS_ADMIN_MASTER_KEY: ${AIOS_ADMIN_MASTER_KEY:-}
      AIOS_OPENROUTER_API_KEY: ${AIOS_OPENROUTER_API_KEY:-}
      AIOS_OPENAI_API_KEY: ${AIOS_OPENAI_API_KEY:-}
      AIOS_ANTHROPIC_API_KEY: ${AIOS_ANTHROPIC_API_KEY:-}
      AIOS_STORAGE_BACKEND: ${AIOS_STORAGE_BACKEND:-local}
      AIOS_S3_BUCKET: ${AIOS_S3_BUCKET:-}
      AIOS_S3_REGION: ${AIOS_S3_REGION:-}
      AIOS_S3_ACCESS_KEY: ${AIOS_S3_ACCESS_KEY:-}
      AIOS_S3_SECRET_KEY: ${AIOS_S3_SECRET_KEY:-}
      AIOS_S3_ENDPOINT: ${AIOS_S3_ENDPOINT:-}
      AIOS_STRIPE_SECRET_KEY: ${AIOS_STRIPE_SECRET_KEY:-}
      AIOS_STRIPE_WEBHOOK_SECRET: ${AIOS_STRIPE_WEBHOOK_SECRET:-}
      AIOS_SMTP_HOST: ${AIOS_SMTP_HOST:-}
      AIOS_SMTP_PASSWORD: ${AIOS_SMTP_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"
      AIOS_LOG_FORMAT: "json"
      AIOS_HTTPS_ONLY: "true"
      AIOS_DASHBOARD_ENABLED: "true"
    volumes:
      - app-data:/data
      - postgres-data:/var/lib/postgresql/data:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8777/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
        reservations: { cpus: "0.5", memory: 512M }

  worker:
    build: .
    command: ["python", "-m", "aios.tasks.worker"]
    environment:
      AIOS_DEBUG: "false"
      AIOS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aios}"
      AIOS_REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0"
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET}
      AIOS_LOG_FORMAT: "json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"
    volumes:
      - app-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

volumes:
  postgres-data:
  redis-data:
  app-data:
