# AIOS — Coolify 1-Click (with Evolution + Kokoro TTS)
# Deploy: Coolify → New Resource → Docker Compose (Raw) → paste this file
# Recommended VPS: 4 vCPU / 8GB RAM minimum (16GB for voice-stt)
# Docs: COOLIFY_SETUP.md

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  otel:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol.yaml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  # ─── Evolution API (WhatsApp Baileys) ───
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`${EVOLUTION_HOST:-evolution.local}`)"
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_secret_change_me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      QRCODE_LIMIT: "30"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/evolution?schema=evolution"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/6"
      REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/6"
      CACHE_REDIS_PREFIX_KEY: evolution-cache
      CACHE_LOCAL_ENABLED: "true"
      LANGUAGE: pt-BR
    volumes:
      - evolution-data:/evolution/instances
      - evolution-store:/evolution/store
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1024M }
        reservations: { cpus: "0.2", memory: 256M }

  app:
    build: .
    ports:
      - "8777:8777"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      AIOS_DEBUG: "false"
      AIOS_APP_URL: ${AIOS_APP_URL}
      AIOS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aios}"
      AIOS_REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0"
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET}
      AIOS_ADMIN_MASTER_KEY: ${AIOS_ADMIN_MASTER_KEY:-}
      AIOS_LLM_PROVIDER: ${AIOS_LLM_PROVIDER:-openrouter}
      AIOS_LITELLM_BASE_URL: ${AIOS_LITELLM_BASE_URL:-http://litellm:4000}
      AIOS_LITELLM_API_KEY: ${AIOS_LITELLM_API_KEY:-sk-litellm}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evolution_secret_change_me}
      EVOLUTION_SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution:8080}
      AIOS_OPENROUTER_API_KEY: ${AIOS_OPENROUTER_API_KEY:-}
      AIOS_OPENAI_API_KEY: ${AIOS_OPENAI_API_KEY:-}
      AIOS_ANTHROPIC_API_KEY: ${AIOS_ANTHROPIC_API_KEY:-}
      AIOS_STORAGE_BACKEND: ${AIOS_STORAGE_BACKEND:-local}
      AIOS_S3_BUCKET: ${AIOS_S3_BUCKET:-}
      AIOS_S3_REGION: ${AIOS_S3_REGION:-}
      AIOS_S3_ACCESS_KEY: ${AIOS_S3_ACCESS_KEY:-}
      AIOS_S3_SECRET_KEY: ${AIOS_S3_SECRET_KEY:-}
      AIOS_S3_ENDPOINT: ${AIOS_S3_ENDPOINT:-}
      AIOS_STRIPE_SECRET_KEY: ${AIOS_STRIPE_SECRET_KEY:-}
      AIOS_STRIPE_WEBHOOK_SECRET: ${AIOS_STRIPE_WEBHOOK_SECRET:-}
      AIOS_SMTP_HOST: ${AIOS_SMTP_HOST:-}
      AIOS_SMTP_PASSWORD: ${AIOS_SMTP_PASSWORD:-}
      AIOS_VOICE_PROVIDER: ${AIOS_VOICE_PROVIDER:-selfhosted}
      AIOS_ELEVENLABS_API_KEY: ${AIOS_ELEVENLABS_API_KEY:-}
      AIOS_ELEVENLABS_VOICE_ID: ${AIOS_ELEVENLABS_VOICE_ID:-}
      AIOS_VAPI_API_KEY: ${AIOS_VAPI_API_KEY:-}
      AIOS_VAPI_ASSISTANT_ID: ${AIOS_VAPI_ASSISTANT_ID:-}
      AIOS_VAPI_PHONE_NUMBER_ID: ${AIOS_VAPI_PHONE_NUMBER_ID:-}
      AIOS_RETELL_API_KEY: ${AIOS_RETELL_API_KEY:-}
      AIOS_RETELL_AGENT_ID: ${AIOS_RETELL_AGENT_ID:-}
      AIOS_VOICE_TTS_URL: ${AIOS_VOICE_TTS_URL:-http://voice-tts-kokoro:8880/v1}
      AIOS_VOICE_STT_URL: ${AIOS_VOICE_STT_URL:-http://voice-stt:9000/v1}
      AIOS_VOICE_BRIDGE_URL: ${AIOS_VOICE_BRIDGE_URL:-}
      AIOS_VOICE_FROM_NUMBER: ${AIOS_VOICE_FROM_NUMBER:-}
      AIOS_VOICE_WEBHOOK_SECRET: ${AIOS_VOICE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"
      AIOS_LOG_FORMAT: "json"
      AIOS_HTTPS_ONLY: "true"
      AIOS_DASHBOARD_ENABLED: "true"
    volumes:
      - app-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8777/health/live"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      start_interval: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536M }
        reservations: { cpus: "0.5", memory: 512M }

  worker:
    build: .
    command: ["python", "-m", "aios.tasks.worker"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      AIOS_DEBUG: "false"
      AIOS_LLM_PROVIDER: ${AIOS_LLM_PROVIDER:-openrouter}
      AIOS_LITELLM_BASE_URL: ${AIOS_LITELLM_BASE_URL:-http://litellm:4000}
      AIOS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aios}"
      AIOS_REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0"
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET}
      AIOS_LOG_FORMAT: "json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"
    volumes:
      - app-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis;from urllib.parse import urlparse;u=os.environ.get('AIOS_REDIS_URL','redis://redis:6379/0');p=urlparse(u);r=redis.Redis(host=p.hostname or 'redis',port=p.port or 6379,password=p.password or os.environ.get('REDIS_PASSWORD',''));r.ping()\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  # ─── Voice Stack: Kokoro TTS (CPU) + Voice Agent ───
  # Kokoro-FastAPI 0.9.4 — OpenAI compat, weighted mix, SSML, captions, tune
  # Enable with: docker compose --profile voice up -d
  voice-tts-kokoro:
    profiles: ["voice"]
    image: ghcr.io/remsky/kokoro-fastapi:0.9.4
    environment:
      USE_GPU: "false"
      ENABLE_VOICE_TAGS: "true"
      ENABLE_INNO_TUNER: "true"
      ALLOW_LOCAL_VOICE_SAVING: "true"
      MODEL_AUTO_UNLOAD_TIMEOUT_SECONDS: "300"
      VOICES_DIR: /app/api/src/voices
    volumes:
      - voice-kokoro-data:/app/api/src/models
      - voice-kokoro-voices:/app/api/src/voices
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G }
        reservations: { cpus: "0.5", memory: 1G }

  voice-agent:
    profiles: ["voice"]
    build: ./deploy/voice-stream
    environment:
      AIOS_URL: http://app:8777
      AIOS_ADMIN_MASTER_KEY: ${AIOS_ADMIN_MASTER_KEY:-}
      OLLAMA_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OPENROUTER_API_KEY: ${AIOS_OPENROUTER_API_KEY:-}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-openai/gpt-4o-mini}
      AIOS_VOICE_LLM_MODEL: ${AIOS_VOICE_LLM_MODEL:-openai/gpt-4o-mini}
      TTS_WS_URL: ws://voice-tts-stream:8001/tts/ws
      VOICE_TTS_ENGINE: ${VOICE_TTS_ENGINE:-kokoro}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-ptbr}
      KOKORO_URL: http://voice-tts-kokoro:8880/v1
      PIPER_URL: http://voice-tts:8000/v1
      STT_URL: http://voice-stt:9000/v1
      VOICE_VAD_ENABLED: ${VOICE_VAD_ENABLED:-true}
      VOICE_VAD_THRESHOLD: ${VOICE_VAD_THRESHOLD:-0.02}
      VOICE_SILENCE_MS: ${VOICE_SILENCE_MS:-800}
      VOICE_BARGE_IN: ${VOICE_BARGE_IN:-true}
      VOICE_BARGE_IN_MIN_MS: ${VOICE_BARGE_IN_MIN_MS:-120}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      voice-tts-kokoro: { condition: service_started }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 2G }
        reservations: { cpus: "0.5", memory: 1G }

  # ─── Optional: Whisper STT (CPU) — enable with --profile voice-stt ───
  # Requires ~4GB RAM. Use model=small for 8GB VPS.
  voice-stt:
    profiles: ["voice-stt"]
    image: ghcr.io/onyx-dot-app/whisper-api:latest
    environment:
      MODEL: ${WHISPER_MODEL:-small}
      DEVICE: ${WHISPER_DEVICE:-cpu}
      COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      BATCH_SIZE: ${WHISPER_BATCH_SIZE:-16}
      NUM_WORKERS: ${WHISPER_NUM_WORKERS:-2}
    ports:
      - "9000:9000"
    volumes:
      - voice-stt-data:/root/.cache/whisper
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }
        reservations: { cpus: "1", memory: 2G }

volumes:
  postgres-data:
  redis-data:
  app-data:
  evolution-data:
  evolution-store:
  voice-kokoro-data:
  voice-kokoro-voices:
  voice-stt-data: