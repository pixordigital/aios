[project]
name = "aios"
version = "0.1.0"
description = "AI Agent Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.0",
    "pyjwt>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "duckduckgo_search>=8.1.0",
    "aiosmtplib>=5.0.0",
    "stripe>=15.0.0",
    "redis>=5.0.0",
    "arq>=0.25",
    "slowapi>=0.1.9",
    "sentry-sdk>=2.0.0",
    "aioboto3>=14.0.0",
]

[project.scripts]
aios = "aios.main:run"
aios-worker = "aios.tasks.worker:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["aios*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


