[project]
name = "aios"
version = "0.1.0"
description = "AI Agent Operating System"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.0",
    "pyjwt>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "duckduckgo_search>=8.1.0",
    "aiosmtplib>=5.0.0",
    "stripe>=15.0.0",
    "redis>=5.0.0",
    "arq>=0.25",
    "slowapi>=0.1.9",
    "sentry-sdk>=2.0.0",
    "aioboto3>=14.0.0",
    "cryptography>=42.0.0",
    "croniter>=2.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]

[project.scripts]
aios = "aios.main:run"
aios-worker = "aios.tasks.worker:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["aios*"]

[tool.ruff]
# Pinned deliberately. With no config, CI enforced whatever ruff's defaults
# happened to be that month -- 1482 findings on rules this project never opted
# into (BLE001 373, B008 330, S110 147). A rule set nobody chose is not a
# standard, it's a version accident.
#
# E4/E7/E9 + F is ruff's classic correctness set: real defects, no pure-style
# noise. Current debt under it is 259 findings (88 F401 unused imports,
# 20 F841, 10 F821, 8 F811, rest E4/E7/E9), and it is meant to stay red until
# that is paid down. Do not widen `select` without first clearing the new rules.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402 is pervasive and harmless here: FastAPI app objects and routers are
# module-level constants that must be defined before route decorators below
# them import them. Ignoring it locally is a lie; excluding it explicitly is not.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Alembic env.py and the CLI entrypoints import before configuring by design.
"alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]


