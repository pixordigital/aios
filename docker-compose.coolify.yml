# Coolify deployment — single app + worker services
# PostgreSQL + Redis expected as separate Coolify services or external

services:
  app:
    build: .
    ports:
      - "8777:8777"
    env_file: .env
    environment:
      AIOS_REDIS_URL: "redis://redis:6379"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8777/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - aios

  worker:
    build: .
    command: ["python", "-m", "aios.tasks.worker"]
    env_file: .env
    environment:
      AIOS_REDIS_URL: "redis://redis:6379"
    volumes:
      - app-data:/data
    restart: unless-stopped
    networks:
      - aios

networks:
  aios:
    name: aios
    driver: bridge

volumes:
  app-data:
