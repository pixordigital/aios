            - '38908ddf-a875-4105-a93f-a4570513911f_app-data:/data'
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - "python -c \"import os,redis;from urllib.parse import urlparse;u=os.environ.get('AIOS_REDIS_URL','redis://redis:6379/0');p=urlparse(u);r=redis.Redis(host=p.hostname or 'redis',port=p.port or 6379,password=p.password or os.environ.get('REDIS_PASSWORD',''));r.ping()\""
            interval: 30s
            timeout: 10s
            start_period: 30s
            retries: 3
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1G
        container_name: worker-38908ddf-a875-4105-a93f-a4570513911f-222816369141
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
