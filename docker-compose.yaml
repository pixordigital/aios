            AIOS_ELEVENLABS_VOICE_ID: ''
            AIOS_VAPI_API_KEY: ''
            AIOS_VAPI_ASSISTANT_ID: ''
            AIOS_VAPI_PHONE_NUMBER_ID: ''
            AIOS_RETELL_API_KEY: ''
            AIOS_RETELL_AGENT_ID: ''
            AIOS_VOICE_TTS_URL: 'http://voice-tts-kokoro:8880/v1'
            AIOS_VOICE_STT_URL: 'http://voice-stt:9000'
            AIOS_VOICE_BRIDGE_URL: ''
            AIOS_VOICE_FROM_NUMBER: ''
            AIOS_VOICE_WEBHOOK_SECRET: ''
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel:4317'
            AIOS_LOG_FORMAT: json
            AIOS_HTTPS_ONLY: 'true'
            AIOS_DASHBOARD_ENABLED: 'true'
            COOLIFY_BRANCH: '"main"'
            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: app-38908ddf-a875-4105-a93f-a4570513911f-222816270975
            SERVICE_NAME_APP: app
            SERVICE_NAME_WORKER: worker
            SERVICE_NAME_VOICE_AGENT: voice-agent
            SERVICE_NAME_VOICE_TTS_KOKORO: voice-tts-kokoro
        volumes:
            - '38908ddf-a875-4105-a93f-a4570513911f_app-data:/data'
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - curl
                - '-sf'
                - 'http://localhost:8777/health/live'
            interval: 15s
            timeout: 10s
            start_period: 90s
            start_interval: 5s
            retries: 10
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1536M
                reservations:
                    cpus: '0.5'
                    memory: 512M
        container_name: app-38908ddf-a875-4105-a93f-a4570513911f-222816270975
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
