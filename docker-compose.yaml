            - coolify.type=application
            - coolify.name=app-38908ddf-a875-4105-a93f-a4570513911f-222816270975
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
            - pixor-aios
            - supabase
        env_file:
            - .env
        image: '38908ddf-a875-4105-a93f-a4570513911f_app:9fc14b2efc7924acf368097fd4387dc5cd7d5d29'

    worker:
        build: .
        command:
            - python
            - '-m'
            - aios.tasks.worker
        environment:
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            REDIS_PASSWORD: changeme
            AIOS_DEBUG: 'false'
            AIOS_LLM_PROVIDER: openrouter
            AIOS_LITELLM_BASE_URL: 'http://litellm:4000'
            AIOS_LITELLM_API_KEY: sk-litellm
            AIOS_DATABASE_URL: 'postgresql+asyncpg://supabase_admin:sSpCePJGfhQlE0J6LhFu03pqa01MLwyU@supabase-db:5432/aios'
            AIOS_REDIS_URL: 'redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0'
