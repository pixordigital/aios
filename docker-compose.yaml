            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: voice-agent-38908ddf-a875-4105-a93f-a4570513911f-222816400696
            SERVICE_NAME_VOICE_AGENT: voice-agent
            SERVICE_NAME_VOICE_TTS_KOKORO: voice-tts-kokoro
        depends_on:
