            REDIS_PORT: '6379'
            REDIS_PASSWORD: changeme
            AIOS_DEBUG: 'false'
            AIOS_APP_URL: '${AIOS_APP_URL}'
            AIOS_DATABASE_URL: 'postgresql+asyncpg://supabase_admin:sSpCePJGfhQlE0J6LhFu03pqa01MLwyU@supabase-db:5432/aios'
            AIOS_REDIS_URL: 'redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0'
            AIOS_JWT_SECRET: '${AIOS_JWT_SECRET}'
            AIOS_ADMIN_MASTER_KEY: c14f4fd66c39770232de0a1f1714add00e2d87d1c4ee76861daaa27142c4aed1
            AIOS_LLM_PROVIDER: openrouter
            AIOS_LITELLM_BASE_URL: 'http://litellm:4000'
            AIOS_LITELLM_API_KEY: sk-litellm
            EVOLUTION_API_KEY: evolution_secret_change_me
            EVOLUTION_SERVER_URL: 'http://evolution:8080'
            AIOS_OPENROUTER_API_KEY: ''
            AIOS_OPENAI_API_KEY: ''
            AIOS_ANTHROPIC_API_KEY: ''
            AIOS_STORAGE_BACKEND: local
            AIOS_S3_BUCKET: ''
            AIOS_S3_REGION: ''
            AIOS_S3_ACCESS_KEY: ''
            AIOS_S3_SECRET_KEY: ''
            AIOS_S3_ENDPOINT: ''
            AIOS_STRIPE_SECRET_KEY: ''
            AIOS_STRIPE_WEBHOOK_SECRET: ''
            AIOS_SMTP_HOST: ''
            AIOS_SMTP_PASSWORD: ''
            AIOS_VOICE_PROVIDER: selfhosted
