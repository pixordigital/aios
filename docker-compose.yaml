        build: ./deploy/voice-stream
        environment:
            AIOS_URL: 'http://app:8777'
            AIOS_ADMIN_MASTER_KEY: c14f4fd66c39770232de0a1f1714add00e2d87d1c4ee76861daaa27142c4aed1
            OLLAMA_URL: 'http://ollama:11434/v1'
            OLLAMA_MODEL: 'qwen3:8b'
            OPENROUTER_API_KEY: '${AIOS_OPENROUTER_API_KEY:-}'
            VOICE_LLM_MODEL: openai/gpt-4o-mini
            AIOS_VOICE_LLM_MODEL: openai/gpt-4o-mini
            TTS_WS_URL: 'ws://voice-tts-stream:8001/tts/ws'
            VOICE_TTS_ENGINE: kokoro
