                limits:
                    cpus: '1'
                    memory: 2G
        container_name: voice-agent-38908ddf-a875-4105-a93f-a4570513911f-222816400696
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
            - coolify.applicationId=4
            - coolify.type=application
            - coolify.name=voice-agent-38908ddf-a875-4105-a93f-a4570513911f-222816400696
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
