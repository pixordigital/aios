services:
    redis:
        image: 'redis:7-alpine'
        command:
            - redis-server
            - '--requirepass'
            - '${REDIS_PASSWORD:-changeme}'
            - '--appendonly'
            - 'yes'
            - '--maxmemory'
            - 256mb
            - '--maxmemory-policy'
            - allkeys-lru
        volumes:
            - '38908ddf-a875-4105-a93f-a4570513911f_redis-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - '-a'
                - '${REDIS_PASSWORD:-changeme}'
                - ping
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        container_name: redis-38908ddf-a875-4105-a93f-a4570513911f-222816157418
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
            - coolify.applicationId=4
            - coolify.type=application
            - coolify.name=redis-38908ddf-a875-4105-a93f-a4570513911f-222816157418
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
            - pixor-aios
        environment:
            COOLIFY_BRANCH: '"main"'
            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: redis-38908ddf-a875-4105-a93f-a4570513911f-222816157418
            SERVICE_NAME_REDIS: redis
        env_file:
            - .env

    otel:
        image: 'otel/opentelemetry-collector-contrib:0.128.0'
        command:
            - '--config=/etc/otelcol.yaml'
        volumes:
            - '/data/coolify/applications/38908ddf-a875-4105-a93f-a4570513911f/deploy/otel-collector.yml:/etc/otelcol.yaml:ro'
        ports:
            - '4317:4317'
            - '4318:4318'
        restart: unless-stopped
        container_name: otel-38908ddf-a875-4105-a93f-a4570513911f-222816167357
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
            - coolify.applicationId=4
            - coolify.type=application
            - coolify.name=otel-38908ddf-a875-4105-a93f-a4570513911f-222816167357
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
            - pixor-aios
        environment:
            COOLIFY_BRANCH: '"main"'
            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: otel-38908ddf-a875-4105-a93f-a4570513911f-222816167357
            SERVICE_NAME_OTEL: otel
        env_file:
            - .env

    litellm:
        image: 'ghcr.io/berriai/litellm:main-latest'
        command:
            - '--config'
            - /app/litellm.yaml
            - '--port'
            - '4000'
            - '--num_workers'
            - '1'
        volumes:
            - '/data/coolify/applications/38908ddf-a875-4105-a93f-a4570513911f/deploy/litellm.yaml:/app/litellm.yaml:ro'
        environment:
            OPENAI_API_KEY: ''
            ANTHROPIC_API_KEY: ''
            GOOGLE_API_KEY: ''
            MUSE_API_KEY: ''
            DEEPSEEK_API_KEY: ''
            QWEN_API_KEY: ''
            COOLIFY_BRANCH: '"main"'
            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: litellm-38908ddf-a875-4105-a93f-a4570513911f-222816191603
            SERVICE_NAME_LITELLM: litellm
        ports:
            - '4000:4000'
        healthcheck:
            test:
                - CMD-SHELL
                - 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=5).read()"'
            interval: 15s
            timeout: 10s
            start_period: 30s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        container_name: litellm-38908ddf-a875-4105-a93f-a4570513911f-222816191603
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
            - coolify.applicationId=4
            - coolify.type=application
            - coolify.name=litellm-38908ddf-a875-4105-a93f-a4570513911f-222816191603
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
            - pixor-aios
        env_file:
            - .env

    evolution:
        image: 'evoapicloud/evolution-api:v2.3.7'
        environment:
            SERVER_URL: 'http://evolution:8080'
            AUTHENTICATION_TYPE: apikey
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY:-evolution_secret_change_me}'
            AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
            QRCODE_LIMIT: '30'
            QRCODE_COLOR: '#00e5a0'
            DATABASE_ENABLED: 'true'
            DATABASE_PROVIDER: postgresql
            DATABASE_CONNECTION_URI: 'postgresql://supabase_admin:sSpCePJGfhQlE0J6LhFu03pqa01MLwyU@supabase-db:5432/aios'
            REDIS_ENABLED: 'true'
            REDIS_URI: 'redis://:${REDIS_PASSWORD:-changeme}@redis:6379/6'
            REDIS_PREFIX_KEY: evolution
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://:${REDIS_PASSWORD:-changeme}@redis:6379/6'
            CACHE_REDIS_PREFIX_KEY: evolution-cache
            CACHE_LOCAL_ENABLED: 'true'
            S3_ENABLED: 'false'
            LANGUAGE: pt-BR
            EVOLUTION_API_KEY: evolution_secret_change_me
            COOLIFY_BRANCH: '"main"'
            COOLIFY_RESOURCE_UUID: 38908ddf-a875-4105-a93f-a4570513911f
            COOLIFY_CONTAINER_NAME: evolution-38908ddf-a875-4105-a93f-a4570513911f-222816239942
            SERVICE_NAME_EVOLUTION: evolution
        volumes:
            - '38908ddf-a875-4105-a93f-a4570513911f_evolution-data:/evolution/instances'
            - '38908ddf-a875-4105-a93f-a4570513911f_evolution-store:/evolution/store'
        ports:
            - '8080:8080'
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - 'wget -qO- http://localhost:8080/ || exit 1'
            interval: 15s
            timeout: 10s
            start_period: 20s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 1024M
                reservations:
                    cpus: '0.2'
                    memory: 256M
        container_name: evolution-38908ddf-a875-4105-a93f-a4570513911f-222816239942
        labels:
            - coolify.managed=true
            - coolify.version=4.1.2
            - coolify.applicationId=4
            - coolify.type=application
            - coolify.name=evolution-38908ddf-a875-4105-a93f-a4570513911f-222816239942
            - coolify.resourceName=pixor-aios
            - coolify.projectName=pixor
            - coolify.serviceName=pixor-aios
            - coolify.environmentName=production
            - coolify.pullRequestId=0
        networks:
            - pixor-aios
            - supabase
        env_file:
            - .env

    app:
