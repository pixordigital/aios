# Cal.com self-hosted scheduling for the sales agents (v6.2.0 pinned).
#
# Lives in its own file because Coolify pulls every service in the app's compose
# file regardless of `profiles`, and calcom/cal.com:v6.2.0 is ~4.5GB unpacked.
# Keeping it in docker-compose.coolify.yml filled the 75GB VPS disk on every
# deploy of an application that never starts Cal.com (profile off).
#
# Start it on purpose, on a machine with room:
#   docker compose -f docker-compose.calcom.yml --profile calcom up -d
#
# Then point the AIOS app at it: AIOS_CALCOM_API_URL (default
# http://calcom-api:80) requires both stacks on the same Docker network; set
# AIOS_CALCOM_API_KEY and AIOS_CALCOM_EVENT_TYPE_ID once the instance is
# configured. Until then cal_booking fails closed, which is correct.
#
# Set CALCOM_DB_PASSWORD, CALCOM_NEXTAUTH_SECRET, CALCOM_JWT_SECRET and
# CALCOM_ENCRYPTION_KEY to real values (the defaults are literally "changeme").

services:
  calcom-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CALCOM_DB:-calcom}
      POSTGRES_USER: ${CALCOM_DB_USER:-calcom}
      POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD:-changeme}
    volumes:
      - calcom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALCOM_DB_USER:-calcom} -d ${CALCOM_DB:-calcom}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  calcom-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  calcom:
    image: calcom/cal.com:v6.2.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calcom.rule=Host(`${CALCOM_HOST:-cal.local}`)"
    environment:
      DATABASE_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      DATABASE_DIRECT_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:-changeme-generate-with-openssl-rand-hex-32}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY:-changeme-generate-32-byte-hex}
      NEXT_PUBLIC_WEBAPP_URL: "https://${CALCOM_HOST:-cal.local}"
      CALCOM_TELEMETRY_DISABLED: "true"
    depends_on:
      calcom-db: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536M }
        reservations: { cpus: "0.2", memory: 512M }

  calcom-api:
    build:
      context: https://github.com/calcom/cal.com.git#v6.2.0
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
        DATABASE_DIRECT_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      DATABASE_DIRECT_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      DATABASE_READ_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      DATABASE_WRITE_URL: "postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASSWORD:-changeme}@calcom-db:5432/${CALCOM_DB:-calcom}"
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:-changeme-generate-with-openssl-rand-hex-32}
      JWT_SECRET: ${CALCOM_JWT_SECRET:-changeme-generate-with-openssl-rand-hex-32}
      API_PORT: "80"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@calcom-redis:6379/2"
      CALCOM_TELEMETRY_DISABLED: "true"
    depends_on:
      calcom-db: { condition: service_healthy }
      calcom-redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1024M }
        reservations: { cpus: "0.2", memory: 256M }

volumes:
  calcom-data:
